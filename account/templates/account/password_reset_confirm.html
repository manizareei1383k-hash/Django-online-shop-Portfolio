{% extends 'shop/base.html' %}

{% block title %}انتخاب رمز جدید{% endblock %}

{% block content %}
<section class="panel">
    {% if validlink %}
        <h1>انتخاب رمز عبور جدید</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">ذخیره رمز جدید</button>
        </form>
    {% else %}
        <h1>لینک نامعتبر است</h1>
        <p>این لینک استفاده شده یا اعتبار آن تمام شده است.</p>
        <a class="button" href="{% url 'account:password_reset' %}">درخواست لینک جدید</a>
    {% endif %}
</section>
{% endblock %}
