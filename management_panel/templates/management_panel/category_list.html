{% extends 'management_panel/base.html' %}
{% block management_content %}
<section class="panel"><div class="actions"><h2>دسته‌بندی‌ها</h2><a class="button" href="{% url 'management_panel:category_create' %}">افزودن دسته‌بندی</a></div></section>
<section class="panel table-wrap"><table><thead><tr><th>نام</th><th>تعداد محصول</th><th>عملیات</th></tr></thead><tbody>{% for category in categories %}<tr><td>{{ category.name }}</td><td>{{ category.products_count }}</td><td><div class="actions"><a href="{% url 'management_panel:category_update' category.pk %}">ویرایش</a><form method="post" action="{% url 'management_panel:category_delete' category.pk %}">{% csrf_token %}<button class="secondary">حذف</button></form></div></td></tr>{% empty %}<tr><td colspan="3">دسته‌ای وجود ندارد.</td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
