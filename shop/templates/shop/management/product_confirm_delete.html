{% extends 'shop/base.html' %}

{% block title %}حذف محصول{% endblock %}

{% block content %}
<section class="panel">
    <h1>حذف محصول</h1>
    <p>آیا از حذف «{{ product.name }}» مطمئن هستید؟ نظرات وابسته به آن نیز حذف می‌شوند.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: #b42318;">بله، حذف شود</button>
        <a href="{% url 'shop:product_management' %}">انصراف</a>
    </form>
</section>
{% endblock %}
